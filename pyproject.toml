[project]
name = "statewave"
version = "1.5.0"
description = "Official Python SDK for Statewave — the open-source memory runtime for AI agents."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Statewave", email = "hello@statewave.ai"},
]
keywords = ["statewave", "ai", "agents", "memory", "context", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://statewave.ai"
Documentation = "https://statewave.ai"
Repository = "https://github.com/smaramwbc/statewave-py"
Issues = "https://github.com/smaramwbc/statewave/issues"
Changelog = "https://github.com/smaramwbc/statewave-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.4,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statewave"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly instead of inheriting ruff's defaults, which
# change between releases (0.16 widened the default selection from 59 rules
# to 413 and turned main red on I001/RUF022). These four prefixes are exactly
# what ruff enforced by default through 0.15, so the lint contract is
# unchanged. Same fix as smaramwbc/statewave#322.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
